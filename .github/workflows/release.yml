name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish
        shell: pwsh
        run: |
          $outDir = "publish/win-x64"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          dotnet publish SlashBar/SlashBar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o $outDir

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "SlashBar-v$version-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "publish/$zipName" -Force
          "zip=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SlashBar ${{ steps.version.outputs.tag }}
          files: publish/SlashBar-v${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
